<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
    <link rel="icon" type="image/png" href="./favicon.png" />
    <title>Live2D Kiosk Demo</title>
    <style>
      :root {
        --accent: #7c5cff;
        --accent-2: #ff5c8a;
        --panel-bg: rgba(18, 18, 32, 0.82);
        --panel-border: rgba(255, 255, 255, 0.12);
        --text: #e8e8f2;
        --text-dim: #9a9ab0;
      }

      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        -webkit-tap-highlight-color: transparent;
      }

      html,
      body {
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #101018;
        font-family: "Segoe UI", "Microsoft YaHei", system-ui, sans-serif;
        color: var(--text);
        user-select: none;
      }

      /* ---------- 中文适配字体（站酷快乐体=圆润 / 站酷小薇体=优雅，含常用 3838 字） ---------- */
      @font-face {
        font-family: 'ZCOOL KuaiLe';
        src: url('/fonts/zcool-kuaile-cn.woff2') format('woff2');
        font-display: block; /* block：字体就绪前不显示 fallback（避免切换闪现）；JS 已做预加载，无空白感 */
      }
      @font-face {
        font-family: 'ZCOOL XiaoWei';
        src: url('/fonts/zcool-xiaowei-cn.woff2') format('woff2');
        font-display: block;
      }

      /* ---------- 背景 ---------- */
      #bg {
        position: fixed;
        inset: 0;
        background:
          radial-gradient(ellipse at 20% 85%, rgba(124, 92, 255, 0.28), transparent 55%),
          radial-gradient(ellipse at 82% 12%, rgba(255, 92, 138, 0.20), transparent 50%),
          linear-gradient(160deg, #14142a 0%, #101018 55%, #0a0a14 100%);
        z-index: 0;
      }

      /* ---------- Canvas ---------- */
      /* 注意：不要设 width/height —— Pixi 根据 screen 尺寸自行设置 canvas 尺寸，
         100vw/100vh 会把 canvas 撑到溢出窗口的 viewport（kiosk 无 WM 时窗口≠屏幕） */
      #live2d {
        position: fixed;
        inset: 0;
        display: block;
        z-index: 1;
        cursor: pointer;
      }

      /* ---------- 左侧面板：时间 / 天气 / 对话气泡（画布基准 800×600 = viewport，屏幕 rotate 后 1:1 显示） ---------- */
      #side-panel {
        position: fixed;
        left: 0;
        top: 0;
        width: 50%;
        height: 100%;
        z-index: 2;
        display: flex;
        flex-direction: column;
        justify-content: center;
        padding: 24px 20px;
        gap: 20px;
        pointer-events: none;
      }
      #time-display {
        font-size: 46px;
        font-weight: 700;
        letter-spacing: 2px;
        text-shadow: 0 2px 14px rgba(0, 0, 0, 0.45);
        font-variant-numeric: tabular-nums;
      }
      #date-display {
        font-size: 15px;
        color: var(--text-dim);
        margin-top: -14px; /* 独立元素，视觉上贴近时间（side-panel gap 20px 抵消） */
        text-shadow: 0 1px 8px rgba(0, 0, 0, 0.5);
      }
      #weather-display {
        font-size: 16px;
        color: var(--text);
        text-shadow: 0 1px 8px rgba(0, 0, 0, 0.5);
        line-height: 1.5;
      }
      #chat-bubble {
        background: linear-gradient(135deg, rgba(124, 92, 255, 0.88) 0%, rgba(124, 92, 255, 0.55) 60%, rgba(124, 92, 255, 0.35) 100%);
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        border: 1px solid rgba(255, 255, 255, 0.12);
        border-radius: 14px;
        padding: 12px 14px;
        font-size: 14px;
        line-height: 1.55;
        color: var(--text);
        /* 宽度自适应内容，最长不超过左半屏；长文本换行 + 向下滚动 */
        width: fit-content;
        max-width: calc(100% / var(--bubble-scale, 1)); /* 随缩放反比：放大后视觉宽度仍不超左半屏（不覆盖右侧模型） */
        min-width: 0; /* flex 子项允许收缩（否则 fit-content 会撑破 max-width） */
        word-break: break-all; /* 强制断行（长 URL/英文串也不溢出）；中文天然可断不受影响 */
        overflow-wrap: break-word;
        transform-origin: left top; /* 缩放从左上角开始：放大时向右下扩展，左边不超出屏幕 */
        max-height: calc(40% / var(--bubble-scale, 1)); /* 高度随缩放反比：放大后视觉高度仍不超过面板 40% */
        overflow-y: auto;
        scrollbar-width: none; /* 隐藏滚动条（kiosk 无鼠标，滚动条无意义） */
        -ms-overflow-style: none;
        /* 注意：不用 backdrop-filter blur —— Mali-G31 上每帧模糊代价大，拖累帧率 */
        transition: opacity 0.4s ease;
      }
      #chat-bubble::-webkit-scrollbar {
        display: none;
      }
      #chat-bubble.empty {
        opacity: 0.45;
        color: var(--text-dim);
      }

      /* ---------- 预览模式（后台排版页 iframe：?preview=1） ---------- */
      body.preview-mode #side-panel { pointer-events: auto; }
      /* 预览包裹层：贴合模块内容尺寸（拖边框=缩放，拖内部=移动） */
      body.preview-mode .pv-wrap {
        position: relative;
        width: fit-content;
        max-width: 100%;
        align-self: flex-start; /* 防 flex 水平拉伸（side-panel 是 column 布局） */
        cursor: move;
        touch-action: none;
        user-select: none;
      }
      /* 虚线框 overlay：fixed 于 body，getBoundingClientRect 实时测量模块实际渲染位置（viewport 坐标直接对齐，不受 wrap transform 影响） */
      body.preview-mode .pv-box {
        position: fixed;
        pointer-events: none;
        z-index: 69;
        border: 2px dashed rgba(255, 111, 159, 0.95); /* 虚线明显（2px 高对比） */
        border-radius: 10px;
        box-sizing: border-box;
        transition: border-color 0.15s ease, box-shadow 0.15s ease;
      }
      /* 鼠标移到模块（wrap hover）→ 边框高亮提示可缩放 */
      body.preview-mode .pv-box.pv-hover,
      body.preview-mode .pv-box.pv-resizing {
        border-color: #ff2d7a;
        border-style: solid;
        box-shadow: 0 0 0 3px rgba(255, 45, 122, 0.18), 0 2px 10px rgba(255, 45, 122, 0.25);
      }

      /* ---------- 加载遮罩 ---------- */
      #loader {
        position: fixed;
        inset: 0;
        z-index: 40;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 16px;
        background: rgba(12, 12, 22, 0.88);
        backdrop-filter: blur(4px);
        transition: opacity 0.35s ease;
      }
      #loader.hidden {
        opacity: 0;
        pointer-events: none;
      }
      .spinner {
        width: 46px;
        height: 46px;
        border-radius: 50%;
        border: 3px solid rgba(255, 255, 255, 0.15);
        border-top-color: var(--accent);
        animation: spin 0.9s linear infinite;
      }
      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }
      #loader-text {
        font-size: 15px;
        color: var(--text-dim);
        letter-spacing: 1px;
      }
      #loader-error {
        display: none;
        max-width: 70vw;
        text-align: center;
        font-size: 13px;
        color: #ff7a7a;
        line-height: 1.6;
        word-break: break-all;
      }

      /* ---------- Toast ---------- */
      #toast {
        position: fixed;
        left: 50%;
        top: 68px;
        transform: translateX(-50%) translateY(-8px);
        z-index: 60;
        padding: 8px 18px;
        border-radius: 999px;
        background: rgba(10, 10, 22, 0.85);
        border: 1px solid var(--panel-border);
        color: var(--text);
        font-size: 13px;
        opacity: 0;
        pointer-events: none;
        transition: opacity 0.25s ease, transform 0.25s ease;
        backdrop-filter: blur(8px);
        max-width: 80vw;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      #toast.show {
        opacity: 1;
        transform: translateX(-50%) translateY(0);
      }
      #toast.err {
        border-color: rgba(255, 110, 110, 0.5);
        color: #ff9c9c;
      }

      /* ---------- 滚动条 ---------- */
    </style>
  </head>

  <body>
    <div id="bg"></div>
    <canvas id="live2d"></canvas>

    <!-- 左侧面板：时间 / 天气 / 对话气泡（从上到下） -->
    <div id="side-panel">
      <div id="time-block">
        <div id="time-display">--:--</div>
      </div>
      <div id="date-display"></div>
      <div id="weather-display">--</div>
      <div id="chat-bubble" class="empty">等待 agent 消息…</div>
    </div>

    <!-- 加载遮罩 -->
    <div id="loader">
      <div class="spinner"></div>
      <div id="loader-text">加载模型中…</div>
      <div id="loader-error"></div>
    </div>

    <!-- Toast -->
    <div id="toast"></div>

    <!-- Live2D Cubism Core（必须先于业务代码加载） -->
    <script src="./Core/live2dcubismcore.js"></script>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
